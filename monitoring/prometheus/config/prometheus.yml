scrape_configs:
  - job_name: 'VivoNet input'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 2s
    static_configs:
      - targets: ['host.docker.internal:8093']
        labels:
          application: "VivoNet webshop"
    basic_auth:
      username: "prometheus"
      password: "secret123"

  - job_name: 'PSP input'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 2s
    static_configs:
      - targets: ['host.docker.internal:8090']
        labels:
          application: "PSP"
    basic_auth:
      username: "prometheus"
      password: "secret123"

  - job_name: 'PCC input'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 2s
    static_configs:
      - targets: [ 'host.docker.internal:8094' ]
        labels:
          application: "PCC"
    basic_auth:
      username: "prometheus"
      password: "secret123"

  - job_name: 'Bank1 input'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 2s
    static_configs:
      - targets: [ 'host.docker.internal:8091' ]
        labels:
          application: "Bank1"
    basic_auth:
      username: "prometheus"
      password: "secret123"