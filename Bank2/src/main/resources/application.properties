spring.application.name=Bank2

server.port=8092

server.ssl.enabled=true

#keystore (backend cert + private key)
server.ssl.key-store=classpath:bank2.p12
server.ssl.key-store-password=password
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bank2

#truststore
server.ssl.trust-store=classpath:truststore.jks
server.ssl.trust-store-password=truststorepassword
server.ssl.trust-store-type=JKS

spring.datasource.url=jdbc:postgresql://localhost:5432/Bank2
spring.datasource.username=postgres
spring.datasource.password=super

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true