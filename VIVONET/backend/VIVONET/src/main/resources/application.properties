spring.application.name=VIVONET
server.port=8093 

server.ssl.enabled=true

#keystore (backend cert + private key)
server.ssl.key-store=classpath:vivonet.p12
server.ssl.key-store-password=password
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=vivonet

#truststore
server.ssl.trust-store=classpath:truststore.jks
server.ssl.trust-store-password=truststorepassword
server.ssl.trust-store-type=JKS

spring.datasource.url=jdbc:postgresql://localhost:5432/vivonet
spring.datasource.username=postgres
spring.datasource.password=super

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

vivonet.app.jwtCookieName= vivonet
vivonet.app.jwtSecret= djanicgligorovsarac123123123123123123123123123123123123
vivonet.app.jwtExpirationMs= 9000000
vivonet.app.jwtRefreshExpirationMs= 900000000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TODO some mail
spring.mail.password=TODO some pass
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000