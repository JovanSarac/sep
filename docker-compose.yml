version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vivonet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: super
    ports:
      - "5050:80"
    depends_on:
      - db

  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    command: "consul agent -dev -client=0.0.0.0"
    ports:
      - "8500:8500"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbit-mq
    hostname: rabbit-mq
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    networks:
      - default


  vivonet-backend:
    build:
      context: ./VIVONET/backend/VIVONET
      dockerfile: Dockerfile
    container_name: vivonet-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vivonet
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: super
      TRACING_URL: http://jaeger:4318/v1/traces
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "8093:8093"
    depends_on:
      - db
      - consul
      - rabbitmq
      - keycloak
    networks:
      - default
      - monitoring

  vivonet-frontend:
    build:
      context: ./VIVONET/frontend/VivoNet
      dockerfile: Dockerfile
    container_name: vivonet-frontend
    environment:
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "4200:443"
    depends_on:
      - vivonet-backend

  psp-backend:
    build:
      context: ./PSP/backend/PSP
      dockerfile: Dockerfile
    container_name: psp-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/psp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: super
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      RABBITMQ_HOST: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      API_GATEWAY_HOST: https://apigateway:8080
      TRACING_URL: http://jaeger:4318/v1/traces
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "8090:8090"
    depends_on:
      - db
      - rabbitmq
      - keycloak
    networks:
      - default
      - monitoring

  psp-frontend:
    build:
      context: ./PSP/frontend/PSP
      dockerfile: Dockerfile
    container_name: psp-frontend
    environment:
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "4201:443"
    depends_on:
      - psp-backend
      - consul
      - rabbitmq

  psp-mq:
    build:
      context: ./PSP-MQ
      dockerfile: Dockerfile
    container_name: psp-mq
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    ports:
      - "9000:9000"
    depends_on:
      - rabbitmq

  apigateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: apigateway
    ports:
      - "9001:9001"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      KEYCLOAK_URL: http://keycloak:8080/realms/sep-realm
    depends_on:
      - consul
      - keycloak

  paypal-service:
    build:
      context: ./Paypal-microservice
      dockerfile: Dockerfile
    container_name: paypal-service
    environment:
      PAYPAL_CLIENT_ID: AbBY_y5YCuAnXFLVSrB-57fpV45ZWPWk8TgViLcgZqvbzM5bzT0YnYe2gyrE8QQHF1fDxbjAZZIPEFwU
      PAYPAL_SECRET: EL1j1Ojf0FaG7HfQG3pedEHV7kiJ4vHhGERxBadqkJskfvAfQl7enBOgUpq8YQqAswbl7dzZsERYpgd1
      PAYPAL_ENV: sandbox
      CONSUL_ADDR: http://consul:8500
      PSP_NOTIFY_URL: https://psp-mq:9000/newPaymentService/create
      PSP_REMOVE_URL: https://psp-mq:9000/newPaymentService/remove
      SERVICE_PORT: 8086
      SERVICE_NAME: paypal
      SERVICE_ADDRESS: paypal-service
    ports:
      - "8086:8086"
    depends_on:
      - consul
    
  card-service:
    build:
      context: ./CardPayment-microservice
      dockerfile: Dockerfile
    container_name: card-service
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      CONSUL_ADDR: http://consul:8500
      PSP_NOTIFY_URL: https://psp-mq:9000/newPaymentService/create
      PSP_REMOVE_URL: https://psp-mq:9000/newPaymentService/remove
      SERVICE_PORT: 8082
      SERVICE_NAME: card
      SERVICE_ADDRESS: card-service
    ports:
      - "8082:8082"
    depends_on:
      - consul
      - keycloak
      - psp-mq

  bank-1-backend:
    build:
      context: ./Bank1/backend/Bank1
      dockerfile: Dockerfile
    container_name: bank-1-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/Bank1
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: super
      TRACING_URL: http://jaeger:4318/v1/traces
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "8091:8091"
    depends_on:
      - db
      - consul
      - keycloak
    networks:
      - default
      - monitoring

  bank-1-frontend:
    build:
      context: ./Bank1/frontend/Bank1
      dockerfile: Dockerfile
    container_name: bank-1-frontend
    environment:
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "4202:443"
    depends_on:
      - bank-1-backend

  pcc:
    build:
      context: ./PCC
      dockerfile: Dockerfile
    container_name: pcc
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pcc
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: super
      TRACING_URL: http://jaeger:4318/v1/traces
    ports:
      - "8094:8094"
    depends_on:
      - db
    networks:
      - default
      - monitoring

  bank-2-backend:
    build:
      context: ./Bank2
      dockerfile: Dockerfile
    container_name: bank-2-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/Bank2
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: super
      TRACING_URL: http://jaeger:4318/v1/traces
    ports:
      - "8092:8092"
    depends_on:
      - db
    networks:
      - default
      - monitoring


  prometheus:
    image: prom/prometheus:v2.35.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - 9090:9090
    networks:
      - monitoring

  grafana:
    image: grafana/grafana-oss:8.5.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning  # optional: for provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_LOG_MODE=console file  # Fixed typo: was GF_LOG_MDOE
      - GF_LOG_FILTERS=alerting.notifier.slack:debug alertmanager:debug ngalert:debug  # Fixed typos
    networks:
      - monitoring
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    restart: unless-stopped
    ports:
      - 3100:3100
    command:
      - "--config.file=/etc/loki/local-config.yaml"
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/logs:/logs
      - ./monitoring/promtail/config/promtail.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro  # Added system logs
    command:
      - "--config.file=/etc/promtail/config.yml"
    networks:
      - monitoring
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    ports:
      - 4318:4318
      - 16686:16686
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"  # Changed from 8088:8080 to 8081:8080 since you mentioned 8080 is taken
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring


volumes:
  postgres-data: 
  grafana_storage:

networks:
  monitoring:
    driver: bridge
